[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openscad-mcp"
version = "0.6.1"
description = "MCP server for OpenSCAD: render, measure, check assemblies, extract features, judge printability, export"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Coop" }
]
keywords = [
    "mcp",
    "openscad",
    "3d-modeling",
    "3d-printing",
    "rendering",
    "cad",
    "assembly",
    "bosl2",
    "model-context-protocol",
    "ai-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14.5,<5",
    "pydantic>=2.11.7",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/robertcoop/openscad-mcp"
Documentation = "https://github.com/robertcoop/openscad-mcp#readme"
Repository = "https://github.com/robertcoop/openscad-mcp.git"
Issues = "https://github.com/robertcoop/openscad-mcp/issues"
Changelog = "https://github.com/robertcoop/openscad-mcp/blob/main/CHANGELOG.md"

[project.scripts]
openscad-mcp = "openscad_mcp.server:main"

[tool.hatch.build.targets.sdist]
include = [
    "src/**/*.py",
    "src/**/*.yaml",
    "src/**/*.yml",
    "src/**/*.json",
    # Purchased-parts catalog: one generated BOSL2 file per entry, plus the
    # data policy that governs them. Loaded at runtime by parts_catalog.py.
    "src/openscad_mcp/parts/*.scad",
    "src/openscad_mcp/parts/README.md",
    "README.md",
    "README-VERBESSERUNGEN.md",
    "API.md",
    "DEPLOYMENT.md",
    "examples/skill_test.scad",
    "examples/verify_skill_test.py",
    "AGENTS.md",
    "LICENSE",
    "pyproject.toml",
    "skills/**",
    ".claude-plugin/**",
    "mcp-config.json",
]
exclude = [
    "tests/",
    "docs/",
    ".github/",
    "*.pyc",
    "__pycache__/",
    ".pytest_cache/",
    ".coverage",
    ".env",
    ".venv/",
    "test-env/",
    "venv/",
    "dist/",
    "build/",
    "*.egg-info/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openscad_mcp"]
# Keep the purchased-parts catalog in the wheel: parts_catalog.py reads these at
# runtime, so a wheel without them raises FileNotFoundError from part_scad_path().
artifacts = [
    "src/openscad_mcp/parts/*.scad",
    "src/openscad_mcp/parts/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip() without an explicit strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=openscad_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "-v",
    "-p", "no:warnings",
]
markers = [
    "unit: fast, isolated tests",
    "integration: tests that may require external dependencies",
    "performance: wall-clock performance tests",
    "slow: tests that take longer than usual",
    "mcp: MCP protocol tests",
    "render: rendering tests",
    "config: configuration tests",
    "types: type validation tests",
    "edge: unusual inputs and boundary conditions",
    "smoke: basic functionality verification",
    "regression: regression coverage for previously fixed bugs",
]

[tool.coverage.run]
source = ["src/openscad_mcp"]
branch = true
parallel = true
concurrency = ["thread", "multiprocessing"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/__pycache__/*",
    "*/test_*.py",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "except ImportError:",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
